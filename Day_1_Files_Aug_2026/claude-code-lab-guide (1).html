<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code — Lab Guide (Day 2)</title>
<style>
:root{
  --bg:#f6f5f2;
  --panel:#ffffff;
  --ink:#1e1b16;
  --sub:#6b6459;
  --line:#e4e0d8;
  --accent:#a3623b;
  --accent-ink:#ffffff;
  --code-bg:#1e1b16;
  --code-ink:#f2ece0;
  --tag:#eef0e8;
  --ok:#3f7a4f;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Segoe UI',ui-sans-serif,system-ui,Arial,sans-serif;
  line-height:1.55;
}
.shell{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:260px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:22px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--sub);
  margin:0 8px 4px;
}
.brand strong{
  display:block;
  font-size:19px;
  letter-spacing:0;
  text-transform:none;
  color:var(--ink);
  margin-top:2px;
}
nav{margin-top:22px;}
.nav-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:none;
  border:none;
  padding:10px 10px;
  border-radius:8px;
  font-size:14px;
  color:var(--ink);
  cursor:pointer;
  margin-bottom:2px;
}
.nav-btn .num{
  font-size:11px;
  color:var(--sub);
  min-width:18px;
}
.nav-btn:hover{background:var(--tag);}
.nav-btn.active{background:var(--accent);color:var(--accent-ink);}
.nav-btn.active .num{color:var(--accent-ink);opacity:.8;}

/* Main */
.main{flex:1;padding:36px 48px;max-width:900px;}
.progress-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:22px;
}
.progress-bar{
  height:4px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;margin-right:16px;
}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s;}
.progress-label{font-size:12px;color:var(--sub);white-space:nowrap;}

.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.panel h1{font-size:26px;margin:0 0 6px;}
.panel .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;margin-bottom:8px;}
.panel .lead{color:var(--sub);font-size:15px;margin-bottom:26px;max-width:640px;}

h2{font-size:17px;margin:30px 0 8px;padding-top:2px;}
h3{font-size:14.5px;margin:18px 0 6px;color:var(--ink);}
p{font-size:14.5px;color:#3a352d;}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 20px;
  margin-bottom:16px;
}
.step-list{list-style:none;margin:0;padding:0;}
.step-list li{
  display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);
  font-size:14.5px;
}
.step-list li:last-child{border-bottom:none;}
.step-list .dot{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;
  background:var(--tag);color:var(--accent);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}

pre{
  background:var(--code-bg);
  color:var(--code-ink);
  padding:14px 16px;
  border-radius:8px;
  font-size:13px;
  overflow-x:auto;
  position:relative;
  margin:10px 0 16px;
  font-family:'SF Mono',Consolas,Monaco,monospace;
}
.code-wrap{position:relative;}
.copy-btn{
  position:absolute;top:8px;right:8px;
  background:#33302a;color:#d8d2c4;
  border:none;font-size:11px;padding:4px 9px;border-radius:5px;
  cursor:pointer;opacity:.85;
}
.copy-btn:hover{opacity:1;}
.copy-btn.copied{background:var(--ok);color:#fff;}

table{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:13.5px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
td code, p code, li code{
  background:var(--tag);padding:1px 6px;border-radius:4px;font-size:12.5px;
  font-family:'SF Mono',Consolas,Monaco,monospace;color:#8a4a26;
}

.badge{
  display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
  background:var(--tag);color:var(--accent);margin-bottom:2px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr;}}

.flow{
  display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;margin:10px 0 18px;
}
.flow .node{background:var(--tag);border-radius:6px;padding:6px 10px;color:var(--ink);}
.flow .arrow{color:var(--sub);}

.callout{
  border-left:3px solid var(--accent);background:#fbf3ec;padding:10px 14px;border-radius:0 8px 8px 0;
  font-size:13.5px;margin:14px 0;color:#5c4530;
}

.checklist{list-style:none;margin:0;padding:0;}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:5px 0;}
.checklist input{margin-top:3px;}

.nav-footer{
  display:flex;justify-content:space-between;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
}
.nav-footer button{
  background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:8px;
  font-size:13.5px;cursor:pointer;color:var(--ink);
}
.nav-footer button:hover{border-color:var(--accent);color:var(--accent);}
.nav-footer button:disabled{opacity:.35;cursor:default;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d8d2c4;border-radius:8px;}

@media(max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;}
  .main{padding:24px 20px;}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">Lab Guide<strong>Claude Code — Day 2</strong></div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  id:"perms", title:"Permission Models", num:"04",
  kicker:"Access control", lead:"Control which tools and actions Claude can run automatically using allow-lists and deny-lists.",
  html:`
  <div class="flow"><span class="node">/permissions</span><span class="arrow">review rules</span><span class="node">/config</span><span class="arrow">inspect config</span></div>

  <h2>Allow-list — read-only environment</h2>
  <div class="code-wrap"><pre><code>{
  "permissions": {
    "allow": ["Read", "Glob", "Grep"]
  }
}</code></pre><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>

  <h2>Deny-list — block dangerous commands</h2>
  <div class="code-wrap"><pre><code>{
  "permissions": {
    "deny": [
      "Bash(rm -rf *)",
      "Bash(git push --force *)"
    ]
  }
}</code></pre><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>

  <h2>Allow + deny — enterprise setup</h2>
  <div class="code-wrap"><pre><code>{
  "permissions": {
    "allow": [
      "Read", "Glob", "Grep",
      "Bash(npm test)",
      "Bash(npm run lint)"
    ],
    "deny": [
      "Bash(rm -rf *)",
      "Bash(git push --force *)"
    ]
  }
}</code></pre><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>

let current = 0;

function render(){
  const navList = document.getElementById('navList');
  const panels = document.getElementById('panels');
  navList.innerHTML = '';
  panels.innerHTML = '';
  sections.forEach((s,i)=>{
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i===current?' active':'');
    btn.innerHTML = `<span class="num">${s.num}</span> ${s.title}`;
    btn.onclick = ()=>go(i);
    navList.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'panel' + (i===current?' active':'');
    panel.id = 'panel-'+s.id;
    panel.innerHTML = `<div class="kicker">${s.kicker}</div><h1>${s.title}</h1><div class="lead">${s.lead}</div>${s.html}`;
    panels.appendChild(panel);
  });
  updateFooter();
}

function go(i){
  if(i<0 || i>=sections.length) return;
  current = i;
  document.querySelectorAll('.nav-btn').forEach((b,idx)=>b.classList.toggle('active', idx===current));
  document.querySelectorAll('.panel').forEach((p,idx)=>p.classList.toggle('active', idx===current));
  updateFooter();
  document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
}

function updateFooter(){
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===sections.length-1;
  document.getElementById('nextBtn').textContent = current===sections.length-1 ? 'End →' : 'Next →';
  document.getElementById('progressLabel').textContent = (current+1)+' / '+sections.length;
  document.getElementById('progressFill').style.width = ((current+1)/sections.length*100)+'%';
}

function copyCode(btn){
  const code = btn.previousElementSibling.innerText;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1200);
  });
}

render();
</script>
